# anofit.yaml — 기계별 경로. 대시보드를 띄우는 폴더(현재 디렉터리)에 두거나 ANOFIT_CONFIG 로 가리킨다.
# 전부 선택 사항이다. 없으면 사용자 캐시 폴더(Windows LOCALAPPDATA/anofit, Linux ~/.cache/anofit)를 쓴다.
# 환경 변수가 있으면 그것이 이 파일을 이긴다: ANOFIT_ARTIFACTS_DIR · ANOFIT_TRAIN_CACHE_DIR · ANOFIT_WEIGHTS_DIR.

# 번들(품종당 약 0.1 GB)이 놓이는 곳. 다시 만들 수 없는 것 — 백업 대상.
artifacts_dir: /data/anofit_artifacts

# 학습 중간 산출(품종당 1~3 GB). 지워도 된다 — 빠른 디스크(NVMe)에 둔다.
train_cache_dir: /data/anofit_cache

# 파운데이션 가중치 루트. `anofit fetch` 가 이 아래 _foundation/ 에 받는다 (10.4 GB).
weights_dir: /data/models

# 라이브러리 자체 캐시. 기본이 홈 파티션이라 조용히 차오른다 — 큰 디스크로 옮긴다.
hf_home: /data/hf_cache
torch_home: /data/torch_cache

# 가중치를 표준 배치가 아닌 곳에 두었다면 하나씩 지정한다 (보통 필요 없다).
